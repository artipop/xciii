name: Release

# Cutting a release is one push: `wails3 task version:set VERSION=x.y.z`,
# commit, `git tag -a vx.y.z`, push the tag. This builds every platform, signs
# the update manifest and publishes the lot. docs/release.md is the long form.
#
# The tag's own annotation is the release notes — the same text on the GitHub
# release page and in the app's «Обновления» panel, because they are read by
# the same person about the same release.
#
# Nothing here reimplements the build. The Taskfiles already know how to build
# and package this app on each platform, and the third-party Wails actions on
# the Marketplace are all v2: they know nothing about build/config.yml or about
# a frontend directory called webapp/. Every build step below is `wails3 task …`
# with the runner set up around it.
#
# Every job is native to its platform, and that is not a preference: the board
# server runs on cgo SQLite, NSIS needs makensis, and AppImage shells out to
# ldd. See docs/build-and-platforms.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign everything without publishing a release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  # The module pins this version of Wails; the CLI has to match it, or the
  # build assets are generated by a tool that disagrees with the library.
  WAILS_VERSION: v3.0.0-beta.2

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing must not throw away the others: the artifacts of
      # the jobs that did work are what a re-run does not have to redo.
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            platform: darwin
            arch: arm64
          - name: macOS amd64
            runner: macos-13
            platform: darwin
            arch: amd64
          - name: Windows amd64
            runner: windows-latest
            platform: windows
            arch: amd64
          - name: Linux amd64
            runner: ubuntu-latest
            platform: linux
            arch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: webapp/.nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # Wails' GTK 3 path, which every Linux build here takes: the GTK 4 path
      # needs GTK 4.10, newer than several supported distributions ship.
      - name: Install the Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # The runner image ships NSIS, but a runner image is not a contract.
      - name: Make sure NSIS is present
        if: matrix.platform == 'windows'
        shell: bash
        run: command -v makensis || choco install nsis -y --no-progress

      - name: Install the webapp dependencies
        working-directory: webapp
        run: npm ci

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^const appVersion = "\(.*\)"$/\1/p' version.go)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${version}"

      # A tag whose version does not match the tree's is a release that offers
      # every user an update to the version they are already running, for ever.
      # Cheaper to fail here than to hear it from them.
      - name: Check the tag against the version in the tree
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.version.outputs.version }}" ]; then
            echo "tag ${GITHUB_REF_NAME}, but version.go says ${{ steps.version.outputs.version }}" >&2
            echo "run: wails3 task version:set VERSION=${GITHUB_REF_NAME#v}" >&2
            exit 1
          fi

      # dist/update is what the updater installs; dist/install is what a person
      # downloads the first time. The manifest is generated over the first
      # directory alone — an installer swapped in as if it were the app would
      # replace XCIII with a copy of its own installer.
      - name: Make the output directories
        shell: bash
        run: mkdir -p dist/update dist/install

      # ── macOS ────────────────────────────────────────────────────────────
      # ditto, not zip: a .app is a bundle with symlinks and extended
      # attributes, and `zip -r` quietly flattens both. package:dmg builds the
      # bundle on the way, so this is one build and two artifacts out of it.
      - name: Build and package for macOS
        if: matrix.platform == 'darwin'
        run: |
          wails3 task darwin:package:dmg
          ditto -c -k --keepParent "bin/XCIII.app" \
            "dist/update/XCIII-${{ steps.version.outputs.version }}-darwin-${{ matrix.arch }}.zip"
          mv "bin/XCIII.dmg" \
            "dist/install/XCIII-${{ steps.version.outputs.version }}-darwin-${{ matrix.arch }}.dmg"

      # ── Windows ──────────────────────────────────────────────────────────
      # INSTALL_SCOPE=user rather than the Taskfile's default of machine: an app
      # installed into Program Files cannot replace its own .exe without asking
      # for administrator rights, so a machine-scope install is one that can
      # never update itself.
      - name: Build and package for Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          wails3 task windows:package INSTALL_SCOPE=user
          cp "bin/XCIII.exe" \
            "dist/update/XCIII-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}.exe"
          mv "bin/XCIII-${{ matrix.arch }}-installer.exe" \
            "dist/install/XCIII-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}-installer.exe"

      # ── Linux ────────────────────────────────────────────────────────────
      # The tar.gz is the updatable form: unpacked into a directory the user
      # owns, it can replace itself. A .deb installed into /usr cannot, which is
      # why it is offered for the first install and never to the updater.
      #
      # Only the AppImage and the deb are built. rpm and AUR are in the Taskfile
      # and are left out here: nobody has run them, and a release job is not the
      # place to find out.
      - name: Build and package for Linux
        if: matrix.platform == 'linux'
        run: |
          wails3 task linux:build
          tar -czf "dist/update/XCIII-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz" \
            -C bin XCIII
          wails3 task linux:create:appimage
          wails3 task linux:create:deb
          find bin -maxdepth 1 \( -name '*.AppImage' -o -name '*.deb' \) -exec mv {} dist/install/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^const appVersion = "\(.*\)"$/\1/p' version.go)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The annotated tag's message. A lightweight tag, or a manual run, leaves
      # it empty and the release carries its version and nothing else — better
      # than a commit subject written for other developers.
      - name: Take the release notes from the tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > notes.md
          fi
          if [ ! -s notes.md ]; then
            printf 'XCIII %s\n' "${{ steps.version.outputs.version }}" > notes.md
          fi
          cat notes.md

      # This is the whole trust chain. `manifest` digests every artifact with
      # SHA-512 and signs it with the private half of build/updater.key.pub,
      # which is compiled into every binary this repository ships — so a
      # manifest served by anybody but us fails to verify inside the app.
      #
      # -url-prefix makes the artifact URLs absolute against this tag, which is
      # what lets the app read the manifest through the moving
      # `releases/latest/download/` address without the artifact links moving.
      - name: Sign the release manifest
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "${UPDATER_PRIVATE_KEY}" ]; then
            echo "UPDATER_PRIVATE_KEY is not set — see docs/release.md" >&2
            exit 1
          fi
          printf '%s' "${UPDATER_PRIVATE_KEY}" > updater.key
          wails3 updater manifest \
            -version "${{ steps.version.outputs.version }}" \
            -channel stable \
            -key updater.key \
            -notes-file notes.md \
            -url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${{ steps.version.outputs.version }}/" \
            -output dist/manifest.json \
            dist/update/
          rm -f updater.key

      # The gate: verifying against the *tracked* public key proves the release
      # was signed with the key the shipped binaries trust. A mismatch here is
      # an update nobody could install, caught before it is published.
      - name: Verify the manifest against the key the app is built with
        run: wails3 updater verify -manifest dist/manifest.json -publickey build/updater.key.pub

      - name: Show what would be published
        shell: bash
        run: |
          ls -l dist/update dist/install
          cat dist/manifest.json

      - name: Publish the release
        if: github.ref_type == 'tag' && inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          name: XCIII ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: |
            dist/manifest.json
            dist/update/*
            dist/install/*
